# Every zip is signed with Quissly's release key (secret QUISSLY_RELEASE_SIGNING_KEY); stores
# install a release only when its .sig verifies against the public key in the code.
# On every push to main: if the plugin header's version has no release yet, build the
# plugin zip (one quissly-for-woocommerce/ folder, as WordPress installs it) and publish it
# as GitHub release v<version>, with readme.txt's changelog for that version as its notes.
# Installed plugins check the latest release once a day and WordPress installs it itself
# (includes/class-quissly-updater.php).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^ \* Version: *\([^ ]*\).*/\1/p' quissly-for-woocommerce.php | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "plugin Version '$version' is not x.y.z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - uses: shivammathur/setup-php@v2
        if: steps.version.outputs.exists != '1'
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none
      - name: Build, sign and publish the release
        if: steps.version.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.QUISSLY_RELEASE_SIGNING_KEY }}
        run: |
          git archive --format=zip --prefix=quissly-for-woocommerce/ -o quissly-for-woocommerce.zip HEAD -- . ':(exclude).github'
          [ -n "$SIGNING_KEY" ] || { echo "The QUISSLY_RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          # Sign, and check the signature against the public key the code ships with: a key
          # that does not match would make every store refuse this release.
          ZIP=quissly-for-woocommerce.zip PUBLIC_KEY=$(sed -n "s/.*PUBLIC_KEY = '\([^']*\)'.*/\1/p" includes/class-quissly-updater.php) php -r '
            $zip = file_get_contents(getenv("ZIP"));
            $sig = sodium_crypto_sign_detached($zip, base64_decode(trim(getenv("SIGNING_KEY")), true));
            if (!sodium_crypto_sign_verify_detached($sig, $zip, base64_decode(getenv("PUBLIC_KEY"), true))) {
                fwrite(STDERR, "The signing key does not match the public key in the code\n");
                exit(1);
            }
            file_put_contents(getenv("ZIP") . ".sig", base64_encode($sig));'
          awk -v v="= $VERSION =" '$0 == v {on=1; next} on && /^= / {exit} on' readme.txt > notes.md
          [ -s notes.md ] || echo "Quissly for WooCommerce $VERSION" > notes.md
          gh release create "v$VERSION" quissly-for-woocommerce.zip quissly-for-woocommerce.zip.sig --target "$GITHUB_SHA" \
            --title "Quissly for WooCommerce $VERSION" --notes-file notes.md
